name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  validate-structure:
    name: Verify Repo Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify key files exist
        run: |
          test -f app.py || (echo "app.py missing" && exit 1)
          test -f requirements.txt || (echo "requirements.txt missing" && exit 1)
          test -f README.md || (echo "README.md missing" && exit 1)
          test -f LICENSE || (echo "LICENSE missing" && exit 1)
          test -f .gitignore || (echo ".gitignore missing" && exit 1)
          echo "✅ All required files present"

  validate-python:
    name: Python Syntax & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff
      - name: Check syntax (ruff)
        run: ruff check app.py || true
      - name: Verify imports
        run: python3 -m py_compile app.py

  test-script:
    name: Test Script Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check test_bot.sh syntax
        run: bash -n test_bot.sh

  validate-json:
    name: Validate JSON (if any)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" | while read f; do
            echo "Validating $f"
            python3 -m json.tool "$f" > /dev/null || exit 1
          done

